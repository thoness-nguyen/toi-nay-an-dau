<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where Are We Flying Tonight?</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: playful, a little cheeky, La La Land twilight with Christmas lights. A first-date invite dressed up as a food trip around the world.
IDEA: a departures board. She picks a country, the map "flies" there, and each restaurant is an ornament on the city map.
PICTURE: full-screen live night map with snow and string lights; passport-stamp destinations; postcards per spot.
COLOUR/TYPE: purple-indigo twilight, yellow-dress gold, streetlight pink, star white; Playfair Display + Be Vietnam Pro.
LAYOUT: no vertical scroll. Step 1 a stamp board over the map; step 2 map + boarding-pass chip on top + swipeable postcards at the bottom.
*/
:root{--night:#120f2e;--pine:#2b2470;--paper:#fff7ea;--ink:#1c1838;--gold:#f6c945;--red:#d9417a;--pink:#e86aa8;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--paper);font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0;line-height:1.08;text-wrap:balance}
#map{position:fixed;inset:0;background:#120f2e}
.leaflet-tile-pane{filter:invert(1) hue-rotate(200deg) saturate(.55) brightness(.78) contrast(1.05)}
#dusk{position:fixed;inset:0;z-index:410;pointer-events:none;background:linear-gradient(180deg,#2a1f6b66 0%,#5b2a8a33 45%,#e86aa82a 100%);mix-blend-mode:screen}
.leaflet-container{font:inherit}
.leaflet-control-attribution{background:#120f2ecc!important;color:#a9bdb2!important;font-size:11px}
.leaflet-control-attribution a{color:var(--gold)!important}
.leaflet-control-zoom{margin-top:110px!important}
.leaflet-bar a{background:var(--pine);color:var(--paper);border-color:#4a3fa0}
#snow{position:fixed;inset:0;z-index:420;pointer-events:none}
.lights{position:fixed;z-index:430;top:0;left:0;right:0;height:46px;pointer-events:none}
.lights svg{width:100%;height:100%}
.bulb{animation:tw 2.4s ease-in-out infinite}.bulb:nth-child(3n){animation-delay:-.8s}.bulb:nth-child(3n+1){animation-delay:-1.6s}
@keyframes tw{50%{opacity:.35}}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- step 1: departures ---------- */
.board{position:fixed;inset:0;z-index:700;display:grid;place-items:center;padding:56px 16px 20px;background:linear-gradient(180deg,#141038f0 0%,#2b2470e8 45%,#6a3a9ae0 75%,#d9708ad8 100%);transition:opacity .5s,visibility .5s;overflow-y:auto}
.board.gone{opacity:0;visibility:hidden}
.board-in{position:relative;z-index:1;width:min(980px,100%);text-align:center}
.hills{position:fixed;left:0;right:0;bottom:0;width:100%;height:min(22vh,160px);pointer-events:none}
.kicker{font-size:14px;color:#c9d8cf;margin:0 0 8px}
.board h1{font-size:clamp(32px,6vw,58px)}.board h1 i{color:var(--gold)}
.board .sub{margin:10px auto 26px;max-width:46ch;color:#dfe8e2}
.stamps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:760px){.stamps{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stamp{min-height:130px;padding:12px}.stamp b{font-size:19px}.stamp small{font-size:12.5px}}
.stamp{position:relative;border:0;background:var(--paper);color:var(--ink);border-radius:14px;padding:16px 14px 14px;text-align:left;box-shadow:0 10px 30px #0008;transform:rotate(var(--r,0deg));transition:transform .25s,box-shadow .25s;min-height:150px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.stamp:hover,.stamp:focus-visible{transform:rotate(0) translateY(-4px) scale(1.03);box-shadow:0 16px 40px #000a}
.stamp::before{content:"";position:absolute;inset:6px;border:2px dashed var(--c);border-radius:10px;pointer-events:none;opacity:.7}
.stamp svg{width:46px;height:46px;flex:none}
.stamp b{font-family:"Playfair Display",serif;font-size:22px;line-height:1.1;color:var(--c)}
.stamp small{font-size:13.5px;color:#4a5a52;line-height:1.35}
.stamp .cnt{margin-top:auto;font-size:12px;font-weight:700;color:var(--c)}
.stamp .native{position:absolute;right:12px;top:12px;font-size:20px;color:var(--c);opacity:.35;font-weight:700}

/* ---------- step 2: map UI ---------- */
.head{position:fixed;z-index:500;top:max(30px,env(safe-area-inset-top));left:14px;right:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;pointer-events:none}
.pass{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--paper);color:var(--ink);border-radius:14px;padding:8px 8px 8px 16px;box-shadow:0 8px 30px #0009;max-width:calc(100vw - 140px)}
.pass span{font-size:12px;color:#4a5a52;display:block;line-height:1.2}
.pass b{font-family:"Playfair Display",serif;font-size:20px;color:var(--c,var(--red));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pass button{min-height:40px;border:0;border-radius:10px;background:var(--pine);color:var(--paper);padding:0 14px;font-weight:700;white-space:nowrap}
.dice{pointer-events:auto;font-weight:700;min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--red);color:#fff;box-shadow:0 6px 20px #c8312a66;white-space:nowrap}
body.chosen .head{opacity:0;pointer-events:none}.head{transition:opacity .3s}
body.chosen .head *{pointer-events:none}

.orn{position:relative;width:44px;height:58px;transform-origin:50% 0;animation:sway 4s ease-in-out infinite}
.orn svg{width:100%;height:100%;overflow:visible}
.orn b{position:absolute;left:0;right:0;top:25px;text-align:center;font:700 15px "Playfair Display",serif;color:#fff}
.orn.on{animation:none;transform:scale(1.35)}.orn.on .glow{opacity:1}
.orn .lbl{position:absolute;left:50%;top:62px;transform:translateX(-50%);white-space:nowrap;background:#1c1838ee;color:var(--paper);font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid #f2c14e66;opacity:0;transition:opacity .2s}
.orn.on .lbl{opacity:1}
.glow{opacity:.4;transition:opacity .3s}
@keyframes sway{50%{transform:rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.orn,.bulb{animation:none}}

.deck{position:fixed;z-index:500;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px calc(50vw - 160px) 14px;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.card{position:relative;flex:none;width:320px;cursor:pointer;scroll-snap-align:center;background:var(--paper);color:var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 14px 40px #000a;transition:transform .3s,opacity .3s;opacity:.72;transform:scale(.94)}
.card.on{opacity:1;transform:none}
.card.picked{outline:4px solid var(--gold)}
.pic{position:relative;height:140px;background:#1c3a30}
.pic svg{display:block;width:100%;height:100%}
.tag{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.num{position:absolute;top:8px;left:12px;font:italic 700 15px "Playfair Display",serif;color:var(--paper);text-shadow:0 1px 6px #000}
.body{position:relative;padding:12px 16px 14px}
.card h3{font-size:22px}
.addr{font-size:13px;color:#4a5a52;margin-top:2px}
.vibe{font-size:14.5px;margin:8px 0 6px;line-height:1.45}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:#33443c}
.meta b{color:var(--red)}
.acts{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;min-height:94px}
.acts a,.acts button{min-height:42px;border-radius:999px;border:1.5px solid var(--ink);display:grid;place-items:center;font:500 14px "Be Vietnam Pro",sans-serif;color:var(--ink);text-decoration:none;background:transparent}
.acts .pick{grid-column:1/-1;background:var(--pine);border-color:var(--pine);color:var(--paper);font-weight:700}
.card.picked .pick{background:var(--red);border-color:var(--red)}
/* the run-away button */
.pick.runner{position:absolute;left:0;right:0;bottom:0;transition:transform .18s ease-out;z-index:2}
.soldout{position:absolute;inset:0;display:grid;place-items:center;background:#1c1838cc;opacity:0;transition:opacity .3s;pointer-events:none}
.soldout span{font:800 22px "Playfair Display",serif;color:var(--gold);border:3px solid var(--gold);padding:6px 14px;border-radius:8px;transform:rotate(-8deg);text-align:center;line-height:1.1}
.card.nope .soldout{opacity:1}

/* secret area card */
.secret .body label{display:block;font-size:13px;color:#33443c;margin-top:10px}
.secret input{width:100%;min-height:44px;font:16px "Be Vietnam Pro",sans-serif;border:1.5px solid #1a262055;border-radius:10px;padding:8px 12px;background:#fff;color:var(--ink);margin-top:4px}
.secret .pin{font-size:13px;margin-top:8px;color:#33443c}
.secret .pin b{color:var(--red)}

.toast{position:fixed;z-index:600;left:50%;top:max(34px,env(safe-area-inset-top));width:min(460px,calc(100vw - 28px));justify-content:space-between;transform:translate(-50%,-180%);transition:transform .35s;background:var(--gold);color:var(--ink);border-radius:16px;padding:10px 12px 10px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px #0009}
.toast.show{transform:translate(-50%,0)}
.toast p{margin:0;font-size:15px}.toast b{font-family:"Playfair Display",serif;font-size:17px}
.toast button{font-weight:700;min-height:40px;padding:0 14px;border-radius:999px;border:0;background:var(--ink);color:var(--paper);white-space:nowrap}
.quip{position:fixed;z-index:650;left:50%;bottom:340px;transform:translateX(-50%) scale(.9);opacity:0;transition:.25s;background:var(--red);color:#fff;font-weight:700;padding:8px 16px;border-radius:999px;pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px #0008}
.quip.show{opacity:1;transform:translateX(-50%) scale(1)}
@media(max-width:600px){.deck{padding-inline:calc(50vw - 145px)}.card{width:290px}.pic{height:118px}.pass b{font-size:17px}.quip{bottom:320px}}
@media(max-height:680px){.pic{height:92px}.vibe{display:none}}

/* music: City of Stars (YouTube embed, kept out of sight), 0:07–0:37 on loop */
.yt{position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none;overflow:hidden;z-index:-1}
.yt iframe{width:200px;height:200px;border:0}
.mbtn{position:fixed;z-index:750;right:14px;top:max(92px,calc(env(safe-area-inset-top) + 62px));width:40px;height:40px;border-radius:50%;border:1px solid #f6c94599;background:#1c1838d9;color:var(--gold);font-size:17px;display:grid;place-items:center;box-shadow:0 6px 18px #0008}
.mbtn.on{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.mbtn.on{animation:none}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of the restaurants"></div>
<div id="dusk" aria-hidden="true"></div>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="lights" aria-hidden="true"><svg viewBox="0 0 1200 46" preserveAspectRatio="none" id="lights"></svg></div>

<section class="board" id="board" aria-labelledby="bt">
  <div class="board-in">
    <h1 id="bt">Your <i>Lala land</i> Jade Xink Iu!</h1>
    <p class="sub">Pick your destination</p>
    <div class="stamps" id="stamps"></div>
  </div>
  <svg class="hills" viewBox="0 0 1200 160" preserveAspectRatio="none" aria-hidden="true"><path d="M0 160V96 C140 60 260 70 380 92 S640 40 800 70 S1060 96 1200 64V160Z" fill="#1c1640"/><path d="M0 160V124 C200 100 360 118 520 126 S860 104 1200 120V160Z" fill="#120f2e"/><g transform="translate(930 54)"><rect x="-2" y="0" width="4" height="60" fill="#0c0a24"/><path d="M-10 0h20l-4 -12h-12z" fill="#0c0a24"/><circle cy="-6" r="28" fill="#f6c945" opacity=".25"/><circle cy="-6" r="5" fill="#ffe28a"/></g><g fill="#0c0a24"><circle cx="300" cy="66" r="5"/><path d="M297 70 l-5 26 h4 l3 -14 3 14 h4 l-5 -26z"/><circle cx="318" cy="66" r="5"/><path d="M314 70 q-10 10 -12 26 h22 q-2 -16 -10 -26z" fill="#f6c945"/></g></svg>
</section>

<div class="head" id="head" hidden>
  <div class="pass" id="pass"><div><span>Now boarding</span><b id="dest"></b></div><button id="change">Change</button></div>
  <button class="dice" id="dice">Shuffle</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <p>Date spot: <b id="pickName"></b></p>
  <span style="display:flex;gap:6px"><button id="copy">Copy &amp; send</button><button id="undo" aria-label="Change my mind" title="Change my mind" style="background:transparent;color:var(--ink);border:1.5px solid var(--ink);padding:0 12px">✕</button></span>
</div>
<div class="quip" id="quip" aria-live="polite"></div>
<div class="yt" aria-hidden="true"><div id="ytp"></div></div>
<button class="mbtn" id="mbtn" aria-label="Music on/off">♪</button>
<div class="deck" id="deck" aria-label="Restaurants"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
{
/* ================= postcards (one scene per destination) ================= */
const G=`<defs><radialGradient id="gl"><stop offset="0" stop-color="#f2c14e" stop-opacity=".75"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/></radialGradient></defs>`;
const sky=(id,a,b)=>`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="320" height="150" fill="url(#${id})"/>`;
const stars=`<g fill="#fff" opacity=".7"><circle cx="30" cy="20" r="1"/><circle cx="90" cy="38" r="1.2"/><circle cx="150" cy="14" r="1"/><circle cx="230" cy="30" r="1.1"/><circle cx="290" cy="16" r="1"/></g>`;
const lantern=(x,y,c="#c8312a",s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><circle cy="14" r="22" fill="url(#gl)"/><line y1="-10" y2="2" stroke="#2a1a10" stroke-width="1.5"/><ellipse cy="14" rx="11" ry="13" fill="${c}"/><rect x="-5" y="0" width="10" height="3" fill="#1a1a1a"/><rect x="-5" y="25" width="10" height="3" fill="#1a1a1a"/><path d="M0 28v8" stroke="#f2c14e" stroke-width="1.5"/></g>`;
const steam=(x,y)=>`<g stroke="#f6edd6" stroke-width="2.5" fill="none" opacity=".55" stroke-linecap="round"><path d="M${x-10} ${y} q-6 -10 0 -20 q6 -10 0 -20"/><path d="M${x} ${y-4} q-6 -10 0 -20 q6 -10 0 -20"/><path d="M${x+10} ${y} q-6 -10 0 -20 q6 -10 0 -20"/></g>`;
const ART={
 japan:()=>G+sky("aj","#0c1530","#3a2a4a")+stars+`<path d="M190 120 L250 46 L310 120Z" fill="#2c3550"/><path d="M234 66 L250 46 L266 66 L258 62 L250 68 L242 62Z" fill="#f6edd6"/><circle cx="70" cy="40" r="16" fill="#f6edd6" opacity=".9"/><g fill="#c8312a"><rect x="40" y="66" width="120" height="9" rx="3"/><rect x="48" y="80" width="104" height="6"/><rect x="58" y="75" width="9" height="62"/><rect x="133" y="75" width="9" height="62"/></g><rect y="132" width="320" height="18" fill="#1a1a2a"/>`+lantern(20,40)+lantern(178,44,"#c8312a",.9)+lantern(300,30,"#c8312a",.8),
 korea:()=>G+`<rect width="320" height="150" fill="#2a1a16"/><rect y="98" width="320" height="52" fill="#4a2a1e"/><ellipse cx="160" cy="104" rx="86" ry="24" fill="#1a1a1a"/><ellipse cx="160" cy="100" rx="74" ry="18" fill="#3a3a3a"/><g stroke="#6a6a6a" stroke-width="2">${[110,130,150,170,190,210].map(x=>`<path d="M${x} 86v28"/>`).join("")}</g><g fill="#c8564a"><rect x="118" y="92" width="26" height="9" rx="4"/><rect x="152" y="96" width="26" height="9" rx="4"/><rect x="184" y="90" width="22" height="9" rx="4"/></g>`+steam(160,82)+`<g transform="translate(36 54)"><rect width="18" height="46" rx="4" fill="#3f8a5a"/><rect x="5" y="-12" width="8" height="14" fill="#3f8a5a"/><rect x="2" y="16" width="14" height="12" fill="#f6edd6"/></g><g transform="translate(266 66)"><rect x="-3" y="0" width="22" height="30" rx="4" fill="#f6edd6"/><path d="M2 10h12" stroke="#c8312a" stroke-width="3"/></g><circle cx="160" cy="40" r="60" fill="url(#gl)"/>`,
 china:()=>G+sky("ac","#3a0e10","#7a1a1a")+`<rect y="104" width="320" height="46" fill="#2a1010"/>${[40,100,160,220,280].map((x,i)=>lantern(x,i%2?26:16,"#e2402e",1.1)).join("")}<g transform="translate(160 106)"><ellipse rx="54" ry="12" fill="#b07a3a"/><rect x="-54" y="-24" width="108" height="24" fill="#c9903f"/><ellipse cy="-24" rx="54" ry="12" fill="#d9a65a"/><g fill="#fbf4e4"><circle cx="-24" cy="-28" r="10"/><circle cx="0" cy="-30" r="10"/><circle cx="24" cy="-28" r="10"/></g></g>`+steam(160,64),
 west:()=>G+`<rect width="320" height="150" fill="#2a1a12"/><rect y="96" width="320" height="54" fill="#5a2a1e"/><g fill="#f6edd6" opacity=".12">${Array.from({length:8},(_,i)=>`<rect x="${i*40}" y="96" width="20" height="54"/>`).join("")}</g>${[90,230].map(x=>`<path d="M${x} 0v24" stroke="#111" stroke-width="1.5"/><path d="M${x-14} 36 q14 -20 28 0z" fill="#c8963e"/><circle cx="${x}" cy="42" r="36" fill="url(#gl)"/>`).join("")}<g transform="translate(110 100)"><circle r="34" fill="#e8c27a"/><circle r="29" fill="#c8402a"/><g fill="#fbf4e4"><circle cx="-10" cy="-8" r="6"/><circle cx="12" cy="4" r="6"/><circle cx="-4" cy="14" r="5"/></g><g fill="#3f8a5a"><circle cx="6" cy="-14" r="3"/><circle cx="-16" cy="8" r="3"/></g></g><g transform="translate(222 102)"><ellipse rx="34" ry="10" fill="#f6edd6"/><ellipse rx="20" ry="7" fill="#6a2a18"/><path d="M-12 -2 l24 4" stroke="#3a1408" stroke-width="2"/></g><g fill="none" stroke="#f6edd6" stroke-width="1.5"><path d="M160 70 q6 10 0 16 M160 86 v12 M156 98h8"/></g><path d="M155 76 q5 6 10 0z" fill="#8a1a2a"/>`,

  const d=dest("secret");
  deck.innerHTML=`<article class="card on secret" id="c0" data-i="0">
  <div class="pic"><svg viewBox="0 0 320 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${ART.secret()}</svg><span class="tag" style="background:${d.c}">Your call</span></div>

/* card ↔ map sync */
/* the card nearest the middle of the strip is the active one */
let st;
function centered(){
  const r=deck.getBoundingClientRect(),mid=r.left+r.width/2;let best=-1,bd=1e9;
  deck.querySelectorAll(".card").forEach(c=>{const b=c.getBoundingClientRect(),d=Math.abs(b.left+b.width/2-mid);if(d<bd){bd=d;best=+c.dataset.i}});
  return best;
}
function observe(){}
deck.addEventListener("scroll",()=>{if(lock)return;clearTimeout(st);st=setTimeout(()=>{const i=centered();if(i>-1)go(i)},120)});
/* tap any card (not its buttons/links) to jump to that place */
deck.addEventListener("click",e=>{
  if(e.target.closest("a,button,input,label"))return;
  const c=e.target.closest(".card");if(!c||c.classList.contains("secret"))return;
  go(+c.dataset.i,true);
});
function fly(i){const z=16,pt=map.project(active[i].ll,z).add([0,deckH()/2-30]);map.flyTo(map.unproject(pt,z),z,{duration:.9})}
function go(i,fromMap){
  if(!active.length||i<0||i>=active.length)return;
  if(i===cur&&!fromMap)return;
  cur=i;
  document.querySelectorAll(".orn").forEach(el=>el.classList.toggle("on",el.id==="m"+i));
  deck.querySelectorAll(".card").forEach((el,k)=>el.classList.toggle("on",k===i));
  markers.forEach((m,k)=>m.setZIndexOffset(k===i?1000:0));
  fly(i);
  if(fromMap){lock=true;clearTimeout(st);document.getElementById("c"+i).scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});setTimeout(()=>lock=false,900)}
}

  const b=e.target.closest(".pick");if(!b||b.classList.contains("runner")||b.id==="sGo")return;
  const i=+b.dataset.i,x=active[i];
  if(pick&&pick.n===x.n){clearPick();return}
  clearPick();pick=x;
  const c=document.getElementById("c"+i);c.classList.add("picked");b.textContent="See you there ✓";
  showPick(x.n);
  notify("Jade chọn rồi! ✈️",`${dest(dId).name}: ${x.n} (${x.a})\nOpen: ${x.h}`,["airplane","heart"]);
});
document.getElementById("undo").addEventListener("click",clearPick);
cp.addEventListener("click",async()=>{
  if(!pick)return;
  const d=dest(dId);
  let msg=pick.pin!==undefined
    ?`Destination: Secret Area 🗝️ — ${pick.n}${pick.a?` (${pick.a})`:""}${pick.pin?` 📍 https://maps.google.com/?q=${pick.pin.lat.toFixed(5)},${pick.pin.lng.toFixed(5)}`:""}`
    :`Destination: ${d.name} ✈️ — ${pick.n} (${pick.a}) 🎄`;
  try{await navigator.clipboard.writeText(msg);cp.textContent="Copied!"}catch(e){cp.textContent="Screenshot it 😉"}
  setTimeout(()=>cp.textContent="Copy & send",2500);
});

/* ================= the cơm sườn that runs away ================= */
const LINES=["Nope.","Not on a first date 🙈","Nice try","Too fast for you","Still no","Date #5, maybe?"];
let tries=0;
const qp=document.getElementById("quip");let qt;
function quip(t){qp.textContent=t;qp.classList.add("show");clearTimeout(qt);qt=setTimeout(()=>qp.classList.remove("show"),1400)}
function dodge(b){
  const card=b.closest(".card");if(card.classList.contains("nope"))return;
  const box=b.parentElement.getBoundingClientRect(),w=b.offsetWidth;
  const maxX=Math.max(40,box.width-w*.35),dx=(Math.random()<.5?-1:1)*(40+Math.random()*maxX*.6),dy=-(20+Math.random()*120);
  b.style.transform=`translate(${Math.max(-box.width*.55,Math.min(box.width*.55,dx))}px,${dy}px) rotate(${(Math.random()*16-8).toFixed(1)}deg)`;
  b.textContent=LINES[tries%LINES.length];quip(LINES[tries%LINES.length]);tries++;
  if(!trollPinged){trollPinged=true;notify("Báo động cơm sườn 🚨","Jade vừa định chọn Cơm Tấm Tài 😂",["rotating_light"])}
  if(tries>=5){card.classList.add("nope");b.textContent="Sold out";b.style.transform="";b.disabled=true;quip("Okay okay, pick something else 😌")}
}
deck.addEventListener("pointerover",e=>{const b=e.target.closest(".runner");if(b&&e.pointerType==="mouse")dodge(b)});
deck.addEventListener("pointerdown",e=>{const b=e.target.closest(".runner");if(b){e.preventDefault();dodge(b)}});
deck.addEventListener("keydown",e=>{const b=e.target.closest(".runner");if(b&&(e.key==="Enter"||e.key===" ")){e.preventDefault();dodge(b)}});

/* ================= extras ================= */
document.getElementById("dice").addEventListener("click",()=>{
  if(active.length<2)return;let i;do{i=Math.floor(Math.random()*active.length)}while(i===cur);go(i,true);
});
document.addEventListener("keydown",e=>{
  if(board.classList.contains("gone")&&!/INPUT/.test(document.activeElement.tagName)){
    if(e.key==="ArrowRight")go(Math.min(active.length-1,cur+1),true);
    if(e.key==="ArrowLeft")go(Math.max(0,cur-1),true);
  }
});
const ls=document.getElementById("lights");let lh='<path d="M0 8 Q150 40 300 12 T600 12 T900 12 T1200 10" stroke="#0c0a24" stroke-width="2" fill="none"/>';
for(let k=0;k<24;k++){const x=25+k*48.7,y=14+Math.abs(Math.sin(x/95))*16,c=["#c8312a","#f2c14e","#3fa36b","#f6edd6"][k%4];lh+=`<g class="bulb"><circle cx="${x}" cy="${y+7}" r="10" fill="#ffd98a" opacity=".25"/><circle cx="${x}" cy="${y+7}" r="4.5" fill="${k%5?"#ffe6a0":"#f4a6c8"}"/></g>`}
ls.innerHTML=lh;
const cv=document.getElementById("snow"),cx=cv.getContext("2d"),still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let W,H,fl=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;fl=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.6,s:Math.random()*.6+.3,d:Math.random()*6.3}))}
let shot=null,t=0;
function snow(){cx.clearRect(0,0,W,H);t++;for(const f of fl){const a=.35+.65*Math.abs(Math.sin(f.d+t*.02*f.s));cx.fillStyle=`rgba(255,${f.r>2?226:255},${f.r>2?160:255},${still?.8:a})`;cx.beginPath();cx.arc(f.x,f.y,f.r*.8,0,7);cx.fill();if(!still){f.y+=f.s*.15;if(f.y>H){f.y=-4;f.x=Math.random()*W}}}
 if(!still){if(!shot&&Math.random()<.004)shot={x:Math.random()*W*.7,y:Math.random()*H*.35,l:0};if(shot){shot.l+=12;const g=cx.createLinearGradient(shot.x,shot.y,shot.x+shot.l,shot.y+shot.l*.4);g.addColorStop(0,"rgba(255,255,255,0)");g.addColorStop(1,"rgba(255,240,200,.9)");cx.strokeStyle=g;cx.lineWidth=2;cx.beginPath();cx.moveTo(shot.x,shot.y);cx.lineTo(shot.x+shot.l,shot.y+shot.l*.4);cx.stroke();if(shot.l>260)shot=null}requestAnimationFrame(snow)}}
addEventListener("resize",size);size();snow();
}

/* ================= music ================= */
{
  const START=7,END=37,btn=document.getElementById("mbtn");let yp=null,ready=false,wanted=false;
  const setBtn=p=>{btn.classList.toggle("on",p);btn.setAttribute("aria-label",p?"Pause music":"Play music")};
  window.onYouTubeIframeAPIReady=()=>{
    yp=new YT.Player("ytp",{videoId:"WPEVYK6ijhw",playerVars:{start:START,end:END,controls:0,disablekb:1,modestbranding:1,rel:0,playsinline:1},
      events:{onReady:()=>{ready=true;yp.setVolume(45);yp.playVideo()},
        onStateChange:e=>{if(e.data===YT.PlayerState.ENDED){yp.seekTo(START,true);yp.playVideo()}setBtn(e.data===YT.PlayerState.PLAYING)}}});
    setInterval(()=>{if(ready&&yp.getPlayerState&&yp.getPlayerState()===1&&yp.getCurrentTime()>=END)yp.seekTo(START,true)},500);
  };
  const tag=document.createElement("script");tag.src="https://www.youtube.com/iframe_api";document.head.appendChild(tag);
  /* browsers block sound until the first tap, so the music starts on her first tap anywhere */
  const first=e=>{if(e.target&&e.target.closest&&e.target.closest("#mbtn"))return;wanted=true;if(ready&&yp.getPlayerState()!==1)yp.playVideo();["pointerdown","keydown","touchstart"].forEach(t=>removeEventListener(t,first,true))};
  addEventListener("pointerdown",first,true);addEventListener("keydown",first,true);addEventListener("touchstart",first,{capture:true,passive:true});
  btn.addEventListener("click",e=>{e.stopPropagation();["pointerdown","keydown","touchstart"].forEach(t=>removeEventListener(t,first,true));if(!ready){wanted=!wanted;return}
    yp.getPlayerState()===1?yp.pauseVideo():yp.playVideo()});
}
